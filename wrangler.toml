# Cloudflare deployment for the openrcs browsable demo.
#
# A static-assets-only Worker: no server code, just the directory below, which
# is committed to the repo. It has to be committed — assembling the demo means
# recording a real device session, which a build container cannot do — so there
# is no build command and Cloudflare publishes what is already here.
#
# Without this file, `wrangler deploy` looks for a static directory at the repo
# root, finds none (the demo lives under demo/), and fails with "Could not
# detect a directory containing static files".
#
# Rebuild the assets with `demo/build-demo.sh` before deploying.
#
# `name` must match the Cloudflare project; the demo hostname is
# openrcs-demo.stoatworks-labs.com.

name = "openrcs-demo"
compatibility_date = "2026-08-06"

[assets]
directory = "./demo/dist"
