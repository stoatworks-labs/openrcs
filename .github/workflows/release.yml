name: release

# Build native binaries for Windows, macOS and Linux (x86_64 + arm64).
# Linux jobs also emit .deb and .rpm packages via nfpm.
#
# Two shapes come out of one release. The `build` matrix produces the one
# `openrcs-server` binary plus install wrappers for it — the appliance shape,
# for a box in the rack that only runs the server. The `launcher` matrix wraps
# the same binary in the av-launcher tray shell from launcher/ for a laptop
# next to the switcher.
#
# The rl_* helpers come from the vendored scripts/release-lib.sh, which
# scripts/release-local.sh also uses, so a CI artefact and a locally cut one
# are identical.
#
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   pkgarch: amd64 }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  pkgarch: arm64 }
          - { name: windows-x86_64,  os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-aarch64, os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          # macos-13 is retired; cross-compiling x86_64 on the arm64 image is
          # the supported path.
          # Both arches already built on this one runner, so they are merged
          # into a single universal binary rather than published as two
          # downloads. `target2` is the second triple to build and lipo in; it
          # exists only on this row. universal-apple-darwin is a Tauri bundling
          # target, not a cargo one, so unlike the launcher repos this cannot be
          # expressed by changing `target` — cargo would reject it.
          - { name: macos-universal, os: macos-14,         target: aarch64-apple-darwin, target2: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target2 && format('{0},{1}', matrix.target, matrix.target2) || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Build (release, second macOS arch)
        if: matrix.target2 != ''
        run: cargo build --release --target ${{ matrix.target2 }} --bins

      - name: Stage binaries
        shell: bash
        env:
          BINS: "openrcs-server"
        run: |
          mkdir -p dist
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          t2="${{ matrix.target2 }}"
          for b in $BINS; do
            if [ -n "$t2" ]; then
              # One binary that runs on both Macs, instead of one download each.
              lipo -create \
                "target/${{ matrix.target }}/release/${b}" \
                "target/$t2/release/${b}" \
                -output "dist/${b}"
            else
              cp "target/${{ matrix.target }}/release/${b}${ext}" "dist/${b}${ext}"
            fi
          done
          # Assert it, do not assume it: a lipo that silently produced a thin
          # binary would ship as "universal" and fail on half the Macs that
          # downloaded it. Captured and matched with `case`, never piped into
          # grep -- under `bash -eo pipefail` grep exiting on its first match
          # SIGPIPEs the writer and fails the step BECAUSE the match was found.
          if [ -n "$t2" ]; then
            for b in $BINS; do
              __archs="$( lipo -archs "dist/${b}" )"
              echo "dist/${b}: $__archs"
              case "$__archs" in
                *arm64*) ;;
                *) echo "expected an arm64 slice in $b, got: $__archs" >&2; exit 1 ;;
              esac
              case "$__archs" in
                *x86_64*) ;;
                *) echo "expected an x86_64 slice in $b, got: $__archs" >&2; exit 1 ;;
              esac
            done
          fi
          ls -la dist

      - name: Package .deb and .rpm (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          PKGARCH: ${{ matrix.pkgarch }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          cat > dist/nfpm.yaml <<EOF
          name: openrcs-server
          arch: ${PKGARCH}
          version: "${VERSION}"
          maintainer: Allan Sargeant <allan.sargeant@gmail.com>
          description: Bridge server and web control surface for Analog Way Midra and LiveCore processors
          license: MIT
          contents:
            - src: ./openrcs-server
              dst: /usr/bin/openrcs-server
          EOF
          ( cd dist && nfpm package -f nfpm.yaml -p deb && nfpm package -f nfpm.yaml -p rpm )
          rm -f dist/nfpm.yaml

      - name: Create archive
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../openrcs-server-${{ matrix.name }}.zip" ./*.exe
          else
            tar czf "../openrcs-server-${{ matrix.name }}.tar.gz" --exclude='*.deb' --exclude='*.rpm' .
          fi
          cd ..
          mv dist/*.deb dist/*.rpm . 2>/dev/null || true

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # An archive of a CLI is not an install experience. The .pkg drops the
        # binary under /usr/local and links it into /usr/local/bin; the .dmg
        # carries the same payload for anyone who prefers to copy it by hand.
        run: |
          source scripts/release-lib.sh
          rl_init "openrcs" openrcs-server "${{ steps.ver.outputs.version }}" com.stoatworks.openrcs "$GITHUB_WORKSPACE"
          stage="$RUNNER_TEMP/stage-cli"
          rm -rf "$stage"; mkdir -p "$stage"
          cp dist/openrcs-server "$stage/"
          cp README.md LICENSE ATTRIBUTIONS.md "$stage/" 2>/dev/null || true
          rl_pkg "${{ matrix.name }}-cli" "$stage" --cli
          rl_dmg "${{ matrix.name }}-cli" "$stage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openrcs-server-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
            *.deb
            *.rpm
            *.dmg
            *.pkg
          if-no-files-found: error

  launcher:
    name: launcher-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The tray app for a laptop next to the switcher: the av-launcher shell in
    # launcher/ with openrcs-server bundled inside it. Tauri's bundler shells
    # out to host-only tooling, so it cannot cross-compile — each platform has
    # to build its own, which is precisely why this belongs in CI: a Mac cannot
    # produce the Linux .deb/.rpm at all, and the arm64 Windows VM cannot run
    # Tauri's 32-bit makensis. Native runners solve both.
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin builds both slices and lipos them. It is a
          # Tauri bundling target and not a rustup one, so `rust_targets` is
          # what rustup installs and `target` stays what tauri build is given.
          - { name: macos,   os: macos-14,       target: universal-apple-darwin,   rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin', bundles: app }
          # AppImage bundling (linuxdeploy) is unreliable on CI runners; ship deb + rpm.
          - { name: linux,   os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm' }
          - { name: windows, os: windows-latest, target: x86_64-pc-windows-msvc,   bundles: nsis }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher-${{ matrix.target }}
          workspaces: |
            . -> target
            launcher/src-tauri -> target

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      # The version the bundle reports is the tag's, not whatever
      # tauri.conf.json carried when it was committed — the installed app's
      # plist is what users and the website read back. A dispatch without a
      # tag is a dry run and takes the workspace version instead of the
      # -dev.N label the CLI job uses, because the Windows bundler wants a
      # plain x.y.z.
      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            v="$(awk '/^\[workspace.package\]/{f=1} f&&/^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Embed the server binary
        shell: bash
        # launcher/scripts/prepare.sh builds openrcs-server for the target and
        # copies it into launcher/src-tauri/bin/, where tauri.conf.json lists
        # it as a resource. The universal case builds both real triples and
        # lipos them: the binary INSIDE the app has to be universal too, or a
        # fat wrapper around a thin server launches on an Intel Mac and fails
        # the moment it starts its own server.
        run: |
          TARGET="${{ matrix.target }}" bash launcher/scripts/prepare.sh
          # Tauri resolves resources relative to src-tauri and reports a
          # missing one only at build time, by which point the useful context
          # is gone. Prove the payload is there, and name every resource the
          # manifest asks for, so a mismatch is visible here instead.
          echo "--- launcher/src-tauri/bin ---"
          ls -la launcher/src-tauri/bin
          echo "--- resources tauri.conf.json expects ---"
          node -e "
            const c = require('./launcher/src-tauri/tauri.conf.json');
            for (const r of (c.bundle && c.bundle.resources) || []) console.log(r);
          "

      - name: Duplicate the server binary under its unix name (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # tauri.conf.json lists the resource as bin/openrcs-server with no
        # extension, so Windows needs both spellings on disk. PowerShell does
        # the copy because it does no MSYS-style name resolution — Git Bash
        # resolves a bare name to its .exe sibling, so a `cp` there silently
        # overwrites the .exe instead of creating the extensionless file.
        run: |
          $src = "launcher/src-tauri/bin/openrcs-server.exe"
          Copy-Item $src "launcher/src-tauri/bin/openrcs-server" -Force
          Get-ChildItem launcher/src-tauri/bin | Select-Object Name, Length
          if (-not (Test-Path -LiteralPath "launcher/src-tauri/bin/openrcs-server" -PathType Leaf)) {
            throw "bin/openrcs-server still missing after Copy-Item"
          }

      - name: Build launcher
        # working-directory, not `npm --prefix`: npx has no --prefix, so it
        # resolved the local tauri bin against the repo root, which has no
        # package.json, and died with ENOENT on Windows.
        working-directory: launcher
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx --no-install tauri build \
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"

      # Proof that "universal" is universal. A build that lost a slice looks
      # identical in the log, and this bundle's name carries no architecture
      # at all, so nothing downstream would reveal it either. EVERY Mach-O in
      # the bundle is checked, not just Contents/MacOS/<exe>: the app ships
      # openrcs-server as a resource, and a fat wrapper around a thin server is
      # still broken on half the Macs that download it.
      #
      # Captured and matched with `case`, never piped into grep: steps run as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS launcher is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          appdir="launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="openRCS.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }
          found=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            found=$((found+1))
            echo "${f#$appdir/$app/}: $__archs"
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected an arm64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected an x86_64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
          done < <(find "$appdir/$app" -type f -perm -u+x)
          # A find that matched nothing would pass every check above in silence.
          if [ "$found" -lt 2 ]; then
            echo "expected at least the app binary and the embedded server, found $found" >&2
            exit 1
          fi

      - name: Installers (macOS launcher)
        if: runner.os == 'macOS'
        shell: bash
        # Tauri's own dmg step drives Finder over AppleScript and fails on a
        # headless runner, so the image is built here instead, from the same
        # helpers as the CLI installers. Ad-hoc signed here: the Developer ID
        # signature and notarisation are applied post-hoc by the author's
        # watcher, like every other macOS asset in this release.
        run: |
          source scripts/release-lib.sh
          rl_init "openRCS" openrcs "${{ steps.ver.outputs.version }}" com.allansargeant.openrcs "$GITHUB_WORKSPACE"
          appdir="launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="openRCS.app"
          if [ ! -d "$appdir/$app" ]; then echo "no .app produced" >&2; exit 1; fi
          stage="$RUNNER_TEMP/stage-launcher"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$appdir/$app" "$stage/"
          rl_adhoc_sign "$stage/$app"
          rl_dmg macos-app "$stage" --app "$app"
          rl_pkg macos-app "$stage" --app "$app"

      - name: Collect launcher bundles
        shell: bash
        run: |
          mkdir -p launcher-out
          find launcher/src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \) \
            -exec cp {} launcher-out/ \; 2>/dev/null || true
          cp *.dmg *.pkg launcher-out/ 2>/dev/null || true
          ls -l launcher-out

      - uses: actions/upload-artifact@v7
        with:
          name: openrcs-launcher-${{ matrix.name }}
          path: launcher-out/*
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so both architectures are produced here from the
    # zips the Windows jobs uploaded. Building them on the Windows runners is
    # not viable for arm64 — that image cannot execute the 32-bit makensis.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installers
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          rl_init "openrcs" openrcs-server "$version" com.stoatworks.openrcs "$PWD/installers"
          for arch in x86_64 aarch64; do
            zip="$(find artifacts -name "openrcs-server-windows-${arch}.zip" | head -1)"
            if [ -z "$zip" ]; then
              echo "no build artefact for windows-${arch}, skipping"
              continue
            fi
            stage="$RUNNER_TEMP/stage-${arch}"
            rm -rf "$stage"; mkdir -p "$stage"
            unzip -q "$zip" -d "$stage"
            cp README.md LICENSE ATTRIBUTIONS.md "$stage/" 2>/dev/null || true
            # A server binary has no shortcut to make; --cli installs the files
            # and appends the install dir to the system PATH.
            rl_nsis "windows-${arch}" "$stage" --cli
          done
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: openrcs-server-windows-installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, windows-installers, launcher]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
