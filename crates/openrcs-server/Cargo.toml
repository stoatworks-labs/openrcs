[package]
name = "openrcs-server"
description = "Bridge server and web control surface for Analog Way Midra and LiveCore processors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openrcs-proto = { path = "../openrcs-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
# the web UI is embedded into the binary so a release ships as a single file;
# a --web dir (or the source tree during dev) still overrides it from disk.
rust-embed = "8"
